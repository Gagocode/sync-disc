<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ project.titulo }} - Sync Disc</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <article class="panel">
        <h1>{{ project.titulo }}</h1>
        <p>{{ project.descricao }}</p>
        <p><strong>Tecnologias:</strong> {{ project.tecnologias }}</p>
        {% if project.link %}
          <p><strong>Link:</strong> <a href="{{ project.link }}">{{ project.link }}</a></p>
        {% endif %}
        <p><strong>Data de criacao:</strong> {{ project.created_at }}</p>
      </article>
      <p><a href="/projetos/{{ project.id }}/editar">Editar projeto</a></p>
      <form action="/projetos/{{ project.id }}/excluir" method="post">
        <button type="submit">Excluir projeto</button>
      </form>
      <p><a href="/projetos/">Voltar para projetos</a></p>
    </main>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
