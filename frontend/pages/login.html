<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sync Disc</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <h1>Entrar</h1>
      <form class="form-panel" action="/auth/login" method="post">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Senha
          <input type="password" name="senha" required>
        </label>
        <button type="submit">Entrar</button>
      </form>
      <aside class="demo-box">
        <h2>Conta de demonstracao</h2>
        <p><strong>Email:</strong> demo@syncdisc.local</p>
        <p><strong>Senha:</strong> demo123</p>
      </aside>
      <p>Nao tem conta? <a href="/cadastro">Criar conta</a></p>
    </main>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
