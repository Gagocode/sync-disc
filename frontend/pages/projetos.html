<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projetos - Sync Disc</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <h1>Projetos</h1>
      <p><a href="/projetos/novo">Adicionar projeto</a></p>
      <section class="project-list">
        {% if projects %}
          {% for project in projects %}
            <article class="project-card">
              <h2>{{ project.titulo }}</h2>
              <p>{{ project.descricao }}</p>
              <p><strong>Tecnologias:</strong> {{ project.tecnologias }}</p>
              <p><a href="/projetos/{{ project.id }}">Visualizar</a></p>
            </article>
          {% endfor %}
        {% else %}
          <article class="panel">
            <p>Nenhum projeto cadastrado.</p>
          </article>
        {% endif %}
      </section>
      <p><a href="/dashboard">Voltar ao painel</a></p>
    </main>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
